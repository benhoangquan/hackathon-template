name: ci
on:
  pull_request:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Touches check
        run: python3 scripts/harness.py check-pr --pr ${{ github.event.pull_request.number }}
      - name: Harness unit tests (if scripts changed)
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -q '^scripts/'; then
            python3 -m unittest discover -s scripts/tests -v
          fi
      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != ''
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || '' }}
      - uses: astral-sh/setup-uv@v5
        if: hashFiles('pyproject.toml') != ''
        with:
          enable-cache: true
      - name: Setup and check
        run: |
          start=$(date +%s)
          ./scripts/check.sh setup
          ./scripts/check.sh
          elapsed=$(( $(date +%s) - start ))
          echo "ci took ${elapsed}s"
          if [ "$elapsed" -gt 120 ]; then echo "::warning::ci took ${elapsed}s (target is under 60s)"; fi
